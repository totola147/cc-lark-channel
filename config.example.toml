[lark]
app_id = ""
app_secret = ""

[access]
# List of allowed Lark open_ids. Empty = allow all (dev mode).
# To discover your open_id, set unauthorized_behavior = "reject" and
# send the bot a message — it will reply with your open_id.
allowed_open_ids = []
unauthorized_behavior = "ignore" # "ignore" | "reject"

[claude]
cli_path = "claude"              # path to claude binary in $PATH
default_model = ""               # empty = use CLI default
default_cwd = "/workspace"
permission_mode = "default"      # "default" | "acceptEdits" | "bypassPermissions" | "plan" | "dontAsk" | "auto"（"manual" 等同 default）
permission_timeout_seconds = 120
question_timeout_seconds = 600   # AskUserQuestion 卡片无人作答多久后跳过；0 = 一直等待
max_queue_size = 5
# effort = "high"                 # optional: "low" | "medium" | "high" | "xhigh" | "max"

[render]
hide_thinking = false
show_turn_stats = true
inline_max_bytes = 1500          # max bytes for tool input preview in cards
card_update_interval_ms = 500    # min interval between card updates
heartbeat_interval_ms = 4000     # refresh status card at least this often while working (0 = off)
final_reply_as_message = true    # also post the final answer as a new bottom message (notifies)
final_reply_format = "card"      # "card": reply card with status bar (model | dir | tok | ctx | effort); "text": plain text

[persistence]
state_dir = "~/.cc-lark-channel"

[logging]
level = "info"                   # "trace" | "debug" | "info" | "warn" | "error"

# 运行档（可选）：飞书侧会话使用的网关/settings。终端用
#   cc-session --lark-profile fermi ...     （或环境变量 CC_LARK_PROFILE=fermi）
# 转移时只传档名，地址和凭据都由 agent 这边解析。凭据只写环境变量名，不写明文。
# 档名或凭据缺失时转移会被拒绝，不会回落到默认网关。
# [profiles.fermi]
# base_url = "http://gateway.example:80"         # → ANTHROPIC_BASE_URL
# auth_token_env = "FERMI_AUTH_TOKEN"            # 从该环境变量读取 → ANTHROPIC_AUTH_TOKEN（并清掉 ANTHROPIC_API_KEY）
# # api_key_env = "FERMI_API_KEY"                # 或用 x-api-key 方式 → ANTHROPIC_API_KEY
# settings = "~/.claude/settings.fermi.json"     # 等同 claude --settings
# # model = "opus"                               # 终端未指定 --model 时的默认模型
# # cli_path = "/home/me/.local/bin/claude"      # 该档使用的 claude 可执行文件
# # env = { CLAUDE_CODE_MAX_OUTPUT_TOKENS = "32000" }
