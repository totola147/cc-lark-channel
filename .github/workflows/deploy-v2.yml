name: Deploy v2

on:
  push:
    branches: [v2]
    tags: ["v2.*"]

jobs:
  ci:
    uses: ./.github/workflows/ci-v2.yml

  deploy-relay:
    needs: ci
    # Pinned to the relay host. With two self-hosted runners now online,
    # a bare `self-hosted` could land on the agent host by mistake.
    runs-on: [self-hosted, relay-host]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build
        run: pnpm install && pnpm build

      - name: Deploy Relay
        run: |
          sudo mkdir -p /opt/cc-lark-relay/node_modules/@cc-lark/protocol
          sudo chown -R $(whoami) /opt/cc-lark-relay
          rsync -a --exclude='node_modules' --exclude='.git' --exclude='.env' packages/relay/ /opt/cc-lark-relay/
          rsync -a packages/protocol/dist/ /opt/cc-lark-relay/node_modules/@cc-lark/protocol/dist/
          cp packages/protocol/package.json /opt/cc-lark-relay/node_modules/@cc-lark/protocol/
          cd /opt/cc-lark-relay
          sed -i '/"@cc-lark\/protocol"/d' package.json
          npm install --omit=dev

      - name: Restart Relay service
        run: |
          cd /opt/cc-lark-relay
          if [ -f .env ]; then set -a && source .env && set +a; fi
          pm2 delete cc-lark-relay 2>/dev/null || true
          pm2 start dist/index.cjs --name cc-lark-relay --update-env
          pm2 save

      - name: Health check
        run: |
          sleep 3
          STATUS=$(pm2 jlist 2>/dev/null | python3 -c "
          import json, sys
          try:
            data = json.load(sys.stdin)
            for p in data:
              if p.get('name') == 'cc-lark-relay':
                print(p.get('pm2_env',{}).get('status',''))
                break
          except: print('unknown')
          " 2>/dev/null || echo "unknown")
          if [ "$STATUS" = "online" ]; then
            echo "✅ Relay deployed successfully"
          else
            echo "❌ Relay health check failed: $STATUS"
            pm2 logs cc-lark-relay --lines 10 --nostream || true
            exit 1
          fi

  deploy-agent:
    needs: ci
    # Pinned to the host where the agent actually runs (mslmgr-134).
    # The default self-hosted runner lives on a different machine (relay host),
    # so deploy-agent must target this host's unique label.
    runs-on: [self-hosted, agent-host]
    steps:
      - name: Record previous commit for rollback
        id: prev
        run: |
          echo "commit=$(git -C /opt/cc-lark-channel rev-parse HEAD 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Update, build and restart agent
        run: |
          set -euo pipefail
          cd /opt/cc-lark-channel
          git fetch origin v2
          git checkout v2
          git reset --hard origin/v2
          pnpm install --frozen-lockfile
          pnpm --filter @cc-lark/protocol build
          pnpm --filter @cc-lark/agent build
          sudo systemctl restart cc-lark-channel.service

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            sleep 2
            if systemctl is-active --quiet cc-lark-channel.service \
               && journalctl -u cc-lark-channel.service --since "-30s" --no-pager 2>/dev/null \
                  | grep -q "listening for messages"; then
              echo "✅ Agent deployed and ready"
              exit 0
            fi
          done
          echo "❌ Agent health check failed"
          sudo systemctl status cc-lark-channel.service --no-pager || true
          journalctl -u cc-lark-channel.service --since "-60s" --no-pager | tail -20 || true
          exit 1

      - name: Rollback on failure
        if: failure() && steps.prev.outputs.commit != ''
        run: |
          echo "Rolling back agent to ${{ steps.prev.outputs.commit }}"
          cd /opt/cc-lark-channel
          git reset --hard ${{ steps.prev.outputs.commit }}
          pnpm install --frozen-lockfile
          pnpm --filter @cc-lark/protocol build
          pnpm --filter @cc-lark/agent build
          sudo systemctl restart cc-lark-channel.service
          echo "Rollback complete"
